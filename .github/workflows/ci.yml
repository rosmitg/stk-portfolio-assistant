name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      ANTHROPIC_API_KEY: sk-ant-dummy-key-for-ci
      LANGCHAIN_API_KEY: dummy-langchain-key
      VOYAGE_API_KEY: dummy-voyage-key
      NEWS_API_KEY: dummy-news-key
      PINECONE_API_KEY: dummy-pinecone-key
      DATABASE_URL: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check ../backend ../frontend

      - name: Test
        run: pytest tests/ -v
